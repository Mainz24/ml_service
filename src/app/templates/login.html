<!-- templates/login.html (Улучшенный дизайн) -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему</title>
    <style>
        /* Общие стили */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #71b7e6, #9b59b6);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }

        /* Контейнер формы */
        .form-container {
            background: #fff;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        /* Стили для сообщений об ошибках */
        .error {
            color: #d9534f;
            background-color: #f2dede;
            border: 1px solid #ebccd1;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        /* Стили для полей ввода */
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box; /* Важно для padding */
            font-size: 16px;
        }

        /* Стили для кнопки */
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #6a1b9a; /* Фиолетовый */
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 10px;
        }

        button:hover {
            background: #4a148c;
        }

        /* Стили для ссылки "Регистрация" */
        .register-link {
            margin-top: 20px;
            font-size: 14px;
        }

        .register-link a {
            color: #71b7e6;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Вход в систему</h2>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <!-- Форма отправляется на эндпоинт signin бэкенда -->
        <form method="post" action="/signin">
            <div class="form-group">
                <label for="username">Email:</label>
                <!-- FastAPI OAuth2 требует имя поля 'username', а не 'email' -->
                <input type="email" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Войти</button>
        </form>

        <p class="register-link">Нет аккаунта? <a href="/register">Зарегистрироваться</a></p>
    </div>
</body>
</html>
